<div class="pb-stage" x-data="simplePage" x-init="init()">
  <p class="pb-brand" x-text="ctx.realm.displayName || 'Peekaboo'"></p>
  <p class="pb-tagline">We'll help you get back in</p>

  <div class="pb-card">
    <h1 class="pb-title" x-text="$msg('emailForgotTitle')"></h1>

    <template x-if="ctx.message?.summary">
      <div
        class="pb-alert"
        :class="'pb-alert--' + (ctx.message.type || 'info')"
        role="alert"
        x-html="ctx.message.summary"
      ></div>
    </template>

    <p class="pb-helper pb-helper--muted" style="margin-bottom: 1rem" x-text="$msg('emailInstruction')"></p>

    <form :action="ctx.url.loginAction" method="post">
      <div class="pb-field">
        <label class="pb-label" for="username" x-text="$msg('usernameOrEmail')"></label>
        <input
          class="pb-input"
          type="text"
          id="username"
          name="username"
          :value="ctx.login?.username || ''"
          autocomplete="username"
          autofocus
          required
        />
      </div>

      <button class="pb-btn" type="submit" x-text="$msg('doSubmit')"></button>
    </form>

    <p class="pb-footer">
      <a :href="ctx.url.loginUrl" x-text="$msg('backToLogin')"></a>
    </p>
  </div>
</div>
