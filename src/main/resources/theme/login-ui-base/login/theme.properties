# Keycloak Login UI Base Theme
# 
# Base theme for client-side login UIs. Serializes all Keycloak context data to JSON
# and delegates page rendering to child themes using HTML, JavaScript, Vue, etc.
#
# Child themes should provide:
# - js/main.js: reads pageId from context and renders pages (unless using embedded templates)
# - css/styles.css: theme-specific styles (optional)
#
# The UI should read the page context from:
#   document.getElementById('kc-context').textContent
#
# And render the appropriate page based on context.pageId
#
# EMBEDDED HTML TEMPLATES:
# Set embeddedTemplates=true in your child theme to enable embedded HTML templates.
# When enabled, each page .ftl file will include content from pages/<page-name>.html.
# This allows child themes to provide pure HTML files (with Alpine.js, HTMX, etc.)
# instead of JavaScript template strings. Child themes only need to override the
# .html files in the pages/ directory.

parent=base

# Enable dark mode support
darkMode=true
kcDarkModeClass=pf-v5-theme-dark

# Common styles from PatternFly
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css

# HTML class
kcHtmlClass=login-pf

# Content hash pattern for cache busting
contentHashPattern=js/.*
