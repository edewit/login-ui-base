{#if hasMessage}
<div class="p-3 mb-4 rounded {#if messageType == 'error'}bg-red-100 text-red-900 dark:bg-red-950 dark:text-red-200{#else if messageType == 'warning'}bg-amber-100 text-amber-900 dark:bg-amber-950 dark:text-amber-200{#else if messageType == 'success'}bg-green-100 text-green-900 dark:bg-green-950 dark:text-green-200{#else}bg-blue-100 text-blue-900 dark:bg-blue-950 dark:text-blue-200{/if}">
    {#if hasMessageSummary}
    <span>{messageSummary}</span>
    {/if}
</div>
{/if}
