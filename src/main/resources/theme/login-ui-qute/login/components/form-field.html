<div class="mb-4">
    <label for="{#if id}{id}{#else}{name}{/if}" class="block mb-1 font-semibold">
        {#if label}
        {label}
        {#else}
        {#insert label}Label{/insert}
        {/if}
        {#if required}<span class="text-red-600 dark:text-red-400">*</span>{/if}
    </label>
    <input {#if id}id="{id}"{#else}id="{name}"{/if} name="{name}" type="{#if type}{type}{#else}text{/if}"
           {#if value}value="{value}"{/if}
           {#if autocomplete}autocomplete="{autocomplete}"{/if}
           {#if autofocus}autofocus{/if}
           {#if tabindex}tabindex="{tabindex}"{/if}
           aria-invalid="{#if ariaInvalid}{ariaInvalid}{#else}{hasError}{/if}"
           class="w-full px-3 py-2 border border-gray-300 rounded bg-white text-gray-900 dark:bg-gray-950 dark:border-gray-600 dark:text-gray-100 {#if inputClass}{inputClass}{/if}" />
    {#if hasError}
    <span{#if errorId} id="{errorId}"{/if} class="mt-1 block text-sm text-red-600 dark:text-red-400"{#if errorLive} aria-live="polite"{/if}>
        {error}
    </span>
    {/if}
</div>
