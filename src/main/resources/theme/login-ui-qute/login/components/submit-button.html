<input type="{#if type}{type}{#else}submit{/if}"
       {#if name}name="{name}"{/if}
       {#if id}id="{id}"{/if}
       {#if tabindex}tabindex="{tabindex}"{/if}
       class="px-4 py-2 rounded border border-blue-700 bg-blue-600 text-white cursor-pointer hover:bg-blue-700 dark:bg-blue-600 dark:border-blue-600 dark:hover:bg-blue-500"
       value="{#if value}{value}{#else}{label}{/if}" />
