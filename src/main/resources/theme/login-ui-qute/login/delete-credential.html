{#include template}
<div id="kc-delete-credential">
    <h1 id="kc-page-title">{msg.format('deleteCredentialTitle')}</h1>
    {#include alert /}

    <p>{msg.format('deleteCredentialConfirm', credentialLabel)}</p>

    <form action="{url.loginAction}" method="post">

    </form>
</div>
{/include}
