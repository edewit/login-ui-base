{#include template}
<div id="kc-reset-password-form">
    <h1 id="kc-page-title">{msg.format('emailForgotTitle')}</h1>
    {#include alert /}

    <p class="mb-4 text-gray-600 dark:text-gray-300">{msg.format('emailInstruction')}</p>

    <form action="{url.loginAction}" method="post">
        {#include username-field autofocus=true /}
        {#include form-buttons}
            {#include submit-button value=msg.format('doSubmit') /}
        {/include}
    </form>

    <p><a href="{url.loginUrl}">{msg.format('backToLogin')}</a></p>
</div>
{/include}
