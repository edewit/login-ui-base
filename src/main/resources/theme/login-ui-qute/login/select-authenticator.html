{#include template}
<div id="kc-select-credential">
    <h1 id="kc-page-title">{msg.format('loginChooseAuthenticator')}</h1>
    {#include alert /}

    <form action="{url.loginAction}" method="post">
        <ul>
            {#for selection in authSelections}
            <li>
                <button type="submit" name="authenticationExecution" value="{selection.authExecId}">
                    {msg.format(selection.displayName)}
                    {#if selection.helpText}
                    <small>{msg.format(selection.helpText)}</small>
                    {/if}
                </button>
            </li>
            {/for}
        </ul>
    </form>
</div>
{/include}
