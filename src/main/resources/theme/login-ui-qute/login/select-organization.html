{#include template}
<div id="kc-select-organization">
    <h1 id="kc-page-title">{msg.format('organization.select')}</h1>
    {#include alert /}

    <form action="{url.loginAction}" method="post">
        <ul>
            {#for organization in organizationOptions}
            <li>
                <button type="submit" name="kc.org" value="{organization.alias}">
                    {organization.name}
                </button>
            </li>
            {/for}
        </ul>
    </form>
</div>
{/include}
