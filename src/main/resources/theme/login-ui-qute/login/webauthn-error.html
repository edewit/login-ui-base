{#include template}
<div id="kc-webauthn-error">
    <h1 id="kc-page-title">{msg.format('webauthn-error-title')}</h1>
    {#include alert /}

    <form id="kc-error-credential-form" action="{url.loginAction}" method="post">
        <input type="hidden" id="executionValue" name="authenticationExecution" />
        <input type="hidden" id="isSetRetry" name="isSetRetry" />
    </form>

    <button type="button" id="kc-try-again">{msg.format('doTryAgain')}</button>
    <script type="module" src="{url.resourcesPath}/js/webauthnAuthenticate.js"></script>
</div>
{/include}
